name: Ansible Playbook Engine

on:
  schedule:
    # Wakes up at 18 minutes past 2 AM, 8 AM, 2 PM, and 8 PM UTC
    # (10:18 AM, 4:18 PM, 10:18 PM, and 4:18 AM Singapore Time)
    - cron: '18 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  ansible-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Ansible Playbook Spec
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Ansible playbooks current. Skipping execution."
            exit 0
          fi

          mkdir -p ansible/playbooks
          TARGET_FILE="ansible/playbooks/site.yml"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "---" > "$TARGET_FILE"
            echo "- name: System Configuration Playbook" >> "$TARGET_FILE"
            echo "  hosts: all" >> "$TARGET_FILE"
            echo "  tasks:" >> "$TARGET_FILE"
          fi

          COMPONENTS=("TelemetryAgent" "BufferState" "CacheService" "NodeExporter" "SessionProxy")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "    - name: Configure $PICKED_COMP node $RANDOM" >> "$TARGET_FILE"
          echo "      ansible.builtin.debug:" >> "$TARGET_FILE"
          echo "        msg: \"Deploying node configuration $RANDOM\"" >> "$TARGET_FILE"

          git config --global user.name "anthonylaw66"
          git config --global user.email "anthonylawtan@gmail.com"

          MESSAGES=(
            "feat: add Ansible task module for system configuration"
            "refactor: optimize playbook execution scope"
            "fix: adjust task debug payload parameters"
            "chore: sync Ansible play definitions"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add ansible/
          git commit -m "$MSG"
          git push
